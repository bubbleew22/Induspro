name: Build APK with Bubblewrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          npx @bubblewrap/cli updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="/usr/local/lib/android/sdk"

      - name: Initialize and Build APK
        run: |
          bubblewrap init --manifest=https://bubbleew22.github.io/Induspro/manifest.json --directory=./app
          cd app
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndusPro-APK
          path: ./app/app-release-signed.apkname: Build APK with Bubblewrap

